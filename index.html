<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haven Rise Shelter - LockBox Key Manager</title>
    <style>
        :root {
            --haven-pink: #d81b60;
            --haven-pink-dark: #ad1457;
            --haven-blue: #00a8a8;
            --haven-blue-dark: #008080;
            
            --bg: #12181f;
            --card-bg: #1a222d;
            --section-bg: #222c3a;
            --text: #e1e7ec;
            --text-muted: #8b99a8;
            --border: #2a3545;
            --gray: #6c757d;
            --green: #10b981;
            --red: #ef4444;
            --orange: #f59e0b;
            --primary: var(--haven-pink);
            --primary-hover: var(--haven-pink-dark);
            --sidebar-bg: #0d1217;
            --input-bg: #151c24;
            --zone-bg: #1e293b;
            --zone-text: #38bdf8;
            --parent-header-bg: #1a222d;
            --parent-border: #334155;
            --unit-bg: #141b24;
            --unit-border: var(--haven-blue);
        }

        body.light-mode {
            --bg: #f3f5f8;
            --card-bg: #ffffff;
            --section-bg: #f8fafc;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --sidebar-bg: #0f172a;
            --input-bg: #ffffff;
            --zone-bg: #e0f2fe;
            --zone-text: #0369a1;
            --parent-header-bg: #ffffff;
            --parent-border: #cbd5e1;
            --unit-bg: #f8fafc;
            --unit-border: var(--haven-blue);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            flex-direction: row;
            overflow-x: hidden;
        }

        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-brand {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-brand img {
            height: 32px;
            width: auto;
        }

        .sidebar-brand-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--haven-pink);
            letter-spacing: -0.5px;
            margin: 0;
            line-height: 1;
        }

        .sidebar-brand-sub {
            font-size: 10px;
            color: #38bdf8;
            font-weight: 600;
        }

        .sidebar-section {
            padding: 15px 12px 5px 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #64748b;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            margin: 2px 8px;
            cursor: pointer;
            background: transparent;
            border: none;
            width: calc(100% - 16px);
            text-align: left;
            position: relative;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
        }

        .nav-item.active {
            background-color: var(--haven-pink);
            color: #ffffff;
            font-weight: 600;
        }

        .badge-alert {
            position: absolute;
            right: 12px;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .app-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            width: 100%;
        }

        .top-navbar {
            height: 56px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            color: var(--text);
        }

        .top-tools {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            padding: 20px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
        }

        .stat-card.active {
            border-color: var(--haven-blue);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .card h3 {
            font-size: 14px;
            margin: 0 0 12px 0;
            color: var(--text);
            font-weight: 600;
        }

        .address-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            margin-top: 4px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--haven-blue);
        }

        label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-top: 4px;
            font-weight: 500;
        }

        button {
            padding: 10px 14px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            background-color: var(--primary);
            color: #fff;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-small {
            width: auto;
            padding: 6px 10px;
            font-size: 11px;
            display: inline-block;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 11px;
            text-transform: capitalize;
        }

        .bg-gray { background-color: rgba(108, 117, 125, 0.2); color: #a1a1aa; border: 1px solid rgba(108, 117, 125, 0.4); }
        .bg-green { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .bg-red { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .zone-header {
            background-color: var(--zone-bg);
            color: var(--zone-text);
            font-size: 12px;
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 6px;
            margin: 16px 0 10px 0;
            border-left: 3px solid var(--haven-blue);
            display: flex;
            justify-content: space-between;
        }

        .lockbox-item {
            background-color: var(--parent-header-bg);
            border: 1px solid var(--parent-border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .lockbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .lockbox-header h4 {
            margin: 0;
            font-size: 14px;
            color: var(--text);
            font-weight: 600;
        }

        .hmo-toggle-btn {
            background-color: var(--section-bg);
            color: var(--text);
            border: 1px solid var(--border);
            margin: 10px 0;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .hmo-units-wrapper {
            display: none;
            margin-top: 8px;
            padding-left: 10px;
            border-left: 2px solid var(--unit-border);
        }

        .hmo-units-wrapper.open { display: block; }

        .hmo-unit-box {
            background-color: var(--unit-bg);
            border-left: 3px solid var(--unit-border);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            margin-top: 8px;
        }

        .code-display-box {
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: 6px;
            margin: 8px 0;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .code-display-box span.code-num {
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            color: var(--zone-text);
        }

        .media-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
        }

        .media-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #000;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 8px 0;
            font-size: 12px;
        }

        .checkbox-group input { width: auto; margin: 0; }

        .log-info {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--section-bg);
            padding: 8px 10px;
            border-radius: 6px;
            margin: 8px 0;
            border-left: 3px solid var(--haven-pink);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            width: auto;
            margin: 0;
        }

        details.action-block {
            background-color: var(--section-bg);
            border-radius: 6px;
            margin-top: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        details.action-block summary {
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        details.action-block summary::-webkit-details-marker { display: none; }

        details.action-block summary::after {
            content: "▼";
            font-size: 10px;
            transition: transform 0.2s;
        }

        details.action-block[open] summary::after { transform: rotate(180deg); }

        .action-content { padding: 10px; border-top: 1px solid var(--border); }
        .note-input { display: none; }
        .page-view { display: none; }
        .page-view.active { display: block; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .close-btn {
            background: transparent;
            color: var(--text-muted);
            font-size: 18px;
            width: auto;
            padding: 0;
            margin: 0;
        }

        .history-list-item {
            font-size: 11px;
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
        }

        .viewer-media {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 6px;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .sidebar-section {
                display: none;
            }

            .sidebar-brand {
                padding: 10px 15px;
            }

            .sidebar-nav-container {
                display: flex;
                overflow-x: auto;
                padding: 6px 10px;
                gap: 6px;
                background-color: var(--sidebar-bg);
            }

            .nav-item {
                display: inline-flex;
                width: auto;
                margin: 0;
                padding: 8px 14px;
                font-size: 12px;
                white-space: nowrap;
                flex-shrink: 0;
            }

            .badge-alert {
                position: static;
                margin-left: 6px;
            }

            .container {
                padding: 12px;
                max-width: 100%;
            }

            .stats-row {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .stat-card {
                padding: 10px 8px;
                text-align: center;
            }

            .stat-value {
                font-size: 18px;
            }

            .stat-label {
                font-size: 10px;
                justify-content: center;
            }

            .top-navbar {
                padding: 0 12px;
                height: 48px;
            }

            .page-title {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand">
        <img src="1788858658935.png" alt="Haven Logo">
        <div>
            <div class="sidebar-brand-title">haven</div>
            <div class="sidebar-brand-sub">rise shelter</div>
        </div>
    </div>

    <div class="sidebar-nav-container">
        <button id="navHome" class="nav-item active" onclick="switchTab('home')">
            <span>🏠</span> Properties
        </button>
        <button id="navTasks" class="nav-item" onclick="switchTab('tasks')">
            <span>⚠️</span> Action Required
            <span id="alertCount" class="badge-alert" style="display:none;">0</span>
        </button>
    </div>
</div>

<div class="app-wrapper">
    <div class="top-navbar">
        <h2 class="page-title" id="pageTitleText">LockBox Key Manager</h2>
        <div class="top-tools">
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </div>

    <div class="container">

        <div class="stats-row">
            <div class="stat-card active">
                <div class="stat-label"><span>🟢</span> Inside</div>
                <div class="stat-value" id="statKeysInside">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><span>🔴</span> Missing</div>
                <div class="stat-value" id="statKeysMissing">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><span>⚪</span> Pending</div>
                <div class="stat-value" id="statPending">0</div>
            </div>
        </div>

        <div id="pageHome" class="page-view active">
            <div class="card">
                <h3>+ Add New Property LockBox</h3>
                <div class="address-row">
                    <input type="text" id="boxName" placeholder="Full Address (e.g. 35 Lincoln Rd)">
                    <button class="icon-btn" style="width: 44px; height: 38px; margin-top: 4px;" onclick="findAddress()">🔍</button>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="isHmo" onchange="toggleHmoOptions()">
                    <label for="isHmo" style="font-weight: bold; font-size: 12px; color: var(--text);">Is this an HMO / Multi-Unit Building?</label>
                </div>

                <div id="hmoInputs" style="display:none; background: var(--section-bg); padding: 10px; border-radius: 6px; margin-bottom: 10px;">
                    <label>Number of Flats / Rooms:</label>
                    <input type="number" id="hmoCount" min="1" max="20" value="4">
                    <label>Naming Prefix:</label>
                    <select id="hmoPrefix">
                        <option value="Flat">Flat (e.g. Flat 1, Flat 2)</option>
                        <option value="Room">Room (e.g. Room 1, Room 2)</option>
                        <option value="Unit">Unit (e.g. Unit 1, Unit 2)</option>
                    </select>
                </div>
                
                <label>Add Photos:</label>
                <input type="file" id="boxPhoto" accept="image/*" multiple style="margin-bottom:8px;">
                
                <label>Add Video:</label>
                <input type="file" id="boxVideo" accept="video/*" capture="environment" style="margin-bottom:8px;">

                <button onclick="addLockBox()" style="margin-top: 8px; width: 100%;">Save Property</button>
            </div>

            <input type="text" id="searchFilter" onkeyup="handleSearch()" placeholder="🔍 Search address or flat..." style="margin-bottom: 16px;">

            <div id="boxList"></div>
        </div>

        <div id="pageTasks" class="page-view">
            <div class="card" style="border-left: 4px solid var(--red);">
                <h3>⚠️ Action Required</h3>
                <div id="taskList"></div>
            </div>
        </div>

    </div>
</div>

<div id="historyModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalBoxTitle" style="margin:0;">📜 History</h3>
            <button class="close-btn" onclick="closeModal('historyModal')">✕</button>
        </div>
        <div id="modalHistoryContent"></div>
    </div>
</div>

<div id="mediaModal" class="modal-overlay" onclick="closeModal('mediaModal')">
    <div id="mediaViewerContent" style="text-align: center;"></div>
</div>

<script>
    let lockBoxes = JSON.parse(localStorage.getItem('myLockBoxes')) || [];
    let isDarkMode = localStorage.getItem('isDarkMode') !== 'false';
    let openAccordions = new Set();

    if (!isDarkMode) document.body.classList.add('light-mode');

    function detectZone(address) {
        if (!address) return "General Area";
        const upper = address.toUpperCase();
        const postalMatch = upper.match(/\b([A-Z]{1,2}[0-9]{1,2})\b/);
        return postalMatch ? `Zone ${postalMatch[1]}` : "General Area";
    }

    function toggleHmoOptions() {
        document.getElementById('hmoInputs').style.display = document.getElementById('isHmo').checked ? 'block' : 'none';
    }

    function toggleHmoAccordion(id, prefix = '') {
        const accordionKey = `${prefix}${id}`;
        if (openAccordions.has(accordionKey)) openAccordions.delete(accordionKey);
        else openAccordions.add(accordionKey);

        const wrapper = document.getElementById(`hmo-wrapper-${prefix}${id}`);
        const btn = document.getElementById(`hmo-btn-${prefix}${id}`);
        if (wrapper) {
            wrapper.classList.toggle('open');
            btn.innerHTML = wrapper.classList.contains('open') ? '<span>📂 Hide Flats / Units 🔼</span>' : '<span>📂 Show Flats / Units 🔽</span>';
        }
    }

    function updateStats() {
        let inside = 0, missing = 0, pending = 0;
        lockBoxes.forEach(b => {
            if (b.status === 'green') inside++;
            else if (b.status === 'red') missing++;
            else pending++;

            if (b.isHmo && b.units) {
                b.units.forEach(u => {
                    if (u.status === 'green') inside++;
                    else if (u.status === 'red') missing++;
                    else pending++;
                });
            }
        });
        document.getElementById('statKeysInside').innerText = inside;
        document.getElementById('statKeysMissing').innerText = missing;
        document.getElementById('statPending').innerText = pending;
    }

    function saveAndRender() {
        localStorage.setItem('myLockBoxes', JSON.stringify(lockBoxes));
        renderBoxes();
        renderTasks();
        updateStats();
    }

    function handleSearch() {
        openAccordions.clear();
        renderBoxes();
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        localStorage.setItem('isDarkMode', isDarkMode);
        document.body.classList.toggle('light-mode', !isDarkMode);
    }

    function switchTab(tab) {
        openAccordions.clear();
        document.getElementById('navHome').classList.toggle('active', tab === 'home');
        document.getElementById('navTasks').classList.toggle('active', tab === 'tasks');
        document.getElementById('pageHome').classList.toggle('active', tab === 'home');
        document.getElementById('pageTasks').classList.toggle('active', tab === 'tasks');
        document.getElementById('pageTitleText').innerText = tab === 'home' ? 'LockBox Key Manager' : 'Action Required';
    }

    function findAddress() {
        const query = document.getElementById('boxName').value.trim();
        if (query) window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, '_blank');
    }

    async function addLockBox() {
        const name = document.getElementById('boxName').value.trim();
        const photoInput = document.getElementById('boxPhoto');
        const videoInput = document.getElementById('boxVideo');

        if (!name) return alert('Enter address!');

        const photoDataArray = [];
        if (photoInput.files) {
            for (let file of photoInput.files) photoDataArray.push(await readFileAsDataURL(file));
        }

        const videoDataArray = [];
        if (videoInput.files) {
            for (let file of videoInput.files) videoDataArray.push(await readFileAsDataURL(file));
        }

        const isHmo = document.getElementById('isHmo').checked;
        const units = [];

        if (isHmo) {
            const count = parseInt(document.getElementById('hmoCount').value) || 1;
            const prefix = document.getElementById('hmoPrefix').value;
            for (let i = 1; i <= count; i++) {
                units.push({
                    id: Date.now() + i,
                    unitName: `${prefix} ${i}`,
                    code: 'Not Set',
                    status: 'gray',
                    lastAction: 'Pending initial setup.',
                    actionTime: new Date().toLocaleString(),
                    history: [{ action: `Unit created.`, time: new Date().toLocaleString() }]
                });
            }
        }

        const zone = detectZone(name);
        const now = new Date().toLocaleString();

        lockBoxes.push({
            id: Date.now(),
            name: name,
            zone: zone,
            code: 'Not Set',
            isHmo: isHmo,
            units: units,
            photos: photoDataArray,
            videos: videoDataArray,
            status: 'gray',
            lastAction: 'Property Created',
            actionTime: now,
            history: [{ action: `Main LockBox created.`, time: now }]
        });

        document.getElementById('boxName').value = '';
        document.getElementById('boxPhoto').value = '';
        document.getElementById('boxVideo').value = '';
        document.getElementById('isHmo').checked = false;
        toggleHmoOptions();
        saveAndRender();
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    }

    async function addMoreMedia(id, type, unitId = null) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = type === 'photo' ? 'image/*' : 'video/*';
        if (type === 'video') input.capture = 'environment';
        input.multiple = true;

        input.onchange = async (e) => {
            const box = lockBoxes.find(b => b.id === id);
            let target = unitId ? box.units.find(u => u.id === unitId) : box;

            if (type === 'photo') {
                target.photos = target.photos || [];
                for (let file of e.target.files) target.photos.push(await readFileAsDataURL(file));
            } else {
                target.videos = target.videos || [];
                for (let file of e.target.files) target.videos.push(await readFileAsDataURL(file));
            }
            saveAndRender();
        };

        input.click();
    }

    function updateCode(id, prefix = '', unitId = null) {
        const targetKey = unitId ? `${prefix}unit-${unitId}-` : prefix;
        const newCode = document.getElementById(`${targetKey}code-input-${id}`).value.trim();

        if (!newCode) return alert('Enter code!');

        const box = lockBoxes.find(b => b.id === id);
        let target = unitId ? box.units.find(u => u.id === unitId) : box;

        const oldCode = target.code || 'Not Set';
        target.code = newCode;
        const now = new Date().toLocaleString();

        const logEntry = `Code changed from [${oldCode}] to [${newCode}]`;
        target.lastAction = logEntry;
        target.actionTime = now;
        target.history = target.history || [];
        target.history.unshift({ action: logEntry, time: now });

        saveAndRender();
    }

    function toggleReasonNote(id, section, prefix = '') {
        const reasonSelect = document.getElementById(`${prefix}reason-${section}-${id}`).value;
        document.getElementById(`${prefix}note-${section}-${id}`).style.display = (reasonSelect === 'Other') ? 'block' : 'none';
    }

    function updateKeysGiven(id, prefix = '', unitId = null) {
        const targetKey = unitId ? `${prefix}unit-${unitId}-` : prefix;
        const staff = document.getElementById(`${targetKey}staff-give-${id}`).value;
        const reasonSelect = document.getElementById(`${targetKey}reason-give-${id}`).value;
        const customNote = document.getElementById(`${targetKey}note-give-${id}`).value.trim();
        const isChecked = document.getElementById(`${targetKey}check-give-${id}`).checked;

        if (!isChecked) return alert('Confirm keys were taken!');

        let fullReason = (reasonSelect === 'Other') ? customNote : reasonSelect;

        const targetFlatSelect = document.getElementById(`${targetKey}target-flat-give-${id}`);
        const targetKeyTypeSelect = document.getElementById(`${targetKey}key-type-give-${id}`);

        let targetFlatValue = targetFlatSelect ? targetFlatSelect.value : null;
        let extraDetail = (targetFlatSelect && targetKeyTypeSelect) ? ` [For: ${targetFlatValue} | Key: ${targetKeyTypeSelect.value}]` : '';

        const now = new Date().toLocaleString();
        const box = lockBoxes.find(b => b.id === id);
        let target = unitId ? box.units.find(u => u.id === unitId) : box;

        const logEntry = `Keys removed by ${staff}${extraDetail} [Reason: ${fullReason}]`;
        target.status = 'red';
        target.lastAction = logEntry;
        target.actionTime = now;
        target.history = target.history || [];
        target.history.unshift({ action: logEntry, time: now });

        if (!unitId && box.isHmo && targetFlatValue && targetFlatValue !== 'Whole Building') {
            const matchedUnit = box.units.find(u => u.unitName === targetFlatValue);
            if (matchedUnit) {
                matchedUnit.status = 'red';
                const unitLog = `Main LockBox Key used for ${targetFlatValue} by ${staff}. Flat LockBox needs refilling.`;
                matchedUnit.lastAction = unitLog;
                matchedUnit.actionTime = now;
                matchedUnit.history = matchedUnit.history || [];
                matchedUnit.history.unshift({ action: unitLog, time: now });
            }
        }

        saveAndRender();
    }

    function updateKeysAdded(id, prefix = '', unitId = null) {
        const targetKey = unitId ? `${prefix}unit-${unitId}-` : prefix;
        const staff = document.getElementById(`${targetKey}staff-add-${id}`).value;
        const reasonSelect = document.getElementById(`${targetKey}reason-add-${id}`).value;
        const customNote = document.getElementById(`${targetKey}note-add-${id}`).value.trim();
        const isChecked = document.getElementById(`${targetKey}check-add-${id}`).checked;

        if (!isChecked) return alert('Confirm keys inside!');

        let fullReason = (reasonSelect === 'Other') ? customNote : reasonSelect;

        const targetFlatSelect = document.getElementById(`${targetKey}target-flat-add-${id}`);
        const targetKeyTypeSelect = document.getElementById(`${targetKey}key-type-add-${id}`);

        let targetFlatValue = targetFlatSelect ? targetFlatSelect.value : null;
        let extraDetail = (targetFlatSelect && targetKeyTypeSelect) ? ` [For: ${targetFlatValue} | Key: ${targetKeyTypeSelect.value}]` : '';

        const now = new Date().toLocaleString();
        const box = lockBoxes.find(b => b.id === id);
        let target = unitId ? box.units.find(u => u.id === unitId) : box;

        const logEntry = `Keys added by ${staff}${extraDetail} [Note: ${fullReason}]`;
        target.status = 'green';
        target.lastAction = logEntry;
        target.actionTime = now;
        target.history = target.history || [];
        target.history.unshift({ action: logEntry, time: now });

        saveAndRender();
    }

    function openHistory(id, unitId = null) {
        const box = lockBoxes.find(b => b.id === id);
        let target = unitId ? box.units.find(u => u.id === unitId) : box;
        let title = unitId ? `${box.name} - ${target.unitName}` : box.name;

        document.getElementById('modalBoxTitle').innerText = `📜 History: ${title}`;
        const container = document.getElementById('modalHistoryContent');
        container.innerHTML = '';

        if (!target.history || target.history.length === 0) {
            container.innerHTML = '<p style="font-size:12px; color:var(--text-muted);">No history.</p>';
        } else {
            target.history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-list-item';
                div.innerHTML = `<strong>${item.action}</strong><br><span style="color:var(--text-muted); font-size:10px;">🕒 ${item.time}</span>`;
                container.appendChild(div);
            });
        }
        document.getElementById('historyModal').style.display = 'flex';
    }

    function openMediaViewer(src, type) {
        document.getElementById('mediaViewerContent').innerHTML = type === 'image' 
            ? `<img src="${src}" class="viewer-media">` 
            : `<video src="${src}" class="viewer-media" controls autoplay></video>`;
        document.getElementById('mediaModal').style.display = 'flex';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
        if (id === 'mediaModal') document.getElementById('mediaViewerContent').innerHTML = '';
    }

    function deleteBox(id) {
        if (confirm("Delete property?")) {
            lockBoxes = lockBoxes.filter(b => b.id !== id);
            saveAndRender();
        }
    }

    function renderSingleActionBlock(b, targetObj, isTaskPage, unitId = null) {
        const prefix = isTaskPage ? 'task-' : '';
        const keyPrefix = unitId ? `${prefix}unit-${unitId}-` : prefix;
        const isParentHmo = b.isHmo && !unitId;

        let flatOptionsHtml = '';
        if (isParentHmo && b.units) {
            flatOptionsHtml = `<option value="Whole Building">For: Main Door / Whole Building</option>` +
                b.units.map(u => `<option value="${u.unitName}">For: ${u.unitName}</option>`).join('');
        }

        return `
            <div class="code-display-box">
                <div>🔑 Code: <span class="code-num">${targetObj.code || 'Not Set'}</span></div>
                <div style="display:flex; gap:4px; align-items:center;">
                    <input type="text" id="${keyPrefix}code-input-${b.id}" placeholder="New code" style="width: 80px; padding: 4px 6px; margin: 0; font-size: 11px;">
                    <button class="btn-small" style="padding: 4px 8px;" onclick="updateCode(${b.id}, '${prefix}', ${unitId})">Set Code</button>
                    <button class="history-btn" onclick="openHistory(${b.id}, ${unitId})" title="View History">📜</button>
                </div>
            </div>

            <div class="log-info">
                <div>
                    <strong>Last Action:</strong> ${targetObj.lastAction || 'Created'}<br>
                    ${targetObj.actionTime ? `<span>🕒 ${targetObj.actionTime}</span>` : ''}
                </div>
            </div>

            <details class="action-block" style="border-left: 3px solid var(--red);">
                <summary>🔑 Give Keys / Remove Keys</summary>
                <div class="action-content">
                    ${isParentHmo ? `
                    <select id="${keyPrefix}target-flat-give-${b.id}">${flatOptionsHtml}</select>
                    <select id="${keyPrefix}key-type-give-${b.id}">
                        <option value="Flat Key">Key Type: Flat Key</option>
                        <option value="Main Door Key">Key Type: Main Door Key</option>
                        <option value="Both Keys">Key Type: Both Keys</option>
                    </select>
                    ` : ''}

                    <select id="${keyPrefix}staff-give-${b.id}">
                        <option value="Alex">By: Alex</option>
                        <option value="Denis">By: Denis</option>
                    </select>

                    <select id="${keyPrefix}reason-give-${b.id}" onchange="toggleReasonNote(${b.id}, 'give', '${keyPrefix}')">
                        <option value="Tenant Moved In">Reason: Tenant Moved In</option>
                        <option value="Tenant Lost Keys">Reason: Tenant Lost Keys</option>
                        <option value="Flat LockBox Empty - Giving Main LockBox Key">Reason: Flat LockBox Empty (Giving Main Key)</option>
                        <option value="Other">Reason: Other</option>
                    </select>

                    <input type="text" id="${keyPrefix}note-give-${b.id}" class="note-input" placeholder="Type reason...">

                    <div class="checkbox-group">
                        <input type="checkbox" id="${keyPrefix}check-give-${b.id}">
                        <label for="${keyPrefix}check-give-${b.id}">Keys removed (LockBox empty)</label>
                    </div>

                    <button style="background-color: var(--red); width: 100%;" onclick="updateKeysGiven(${b.id}, '${prefix}', ${unitId})">Update: Keys Removed</button>
                </div>
            </details>

            <details class="action-block" style="border-left: 3px solid var(--green);">
                <summary>📥 Restock / Add Keys</summary>
                <div class="action-content">
                    ${isParentHmo ? `
                    <select id="${keyPrefix}target-flat-add-${b.id}">${flatOptionsHtml}</select>
                    <select id="${keyPrefix}key-type-add-${b.id}">
                        <option value="Flat Key">Key Type: Flat Key</option>
                        <option value="Main Door Key">Key Type: Main Door Key</option>
                        <option value="Both Keys">Key Type: Both Keys</option>
                    </select>
                    ` : ''}

                    <select id="${keyPrefix}staff-add-${b.id}">
                        <option value="Alex">By: Alex</option>
                        <option value="Denis">By: Denis</option>
                    </select>

                    <select id="${keyPrefix}reason-add-${b.id}" onchange="toggleReasonNote(${b.id}, 'add', '${keyPrefix}')">
                        <option value="Refilled / Standard">Reason: Refilled</option>
                        <option value="Added Spare Keys">Reason: Spare Keys</option>
                        <option value="Other">Reason: Other</option>
                    </select>

                    <input type="text" id="${keyPrefix}note-add-${b.id}" class="note-input" placeholder="Type note...">

                    <div class="checkbox-group">
                        <input type="checkbox" id="${keyPrefix}check-add-${b.id}">
                        <label for="${keyPrefix}check-add-${b.id}">Keys inside LockBox</label>
                    </div>

                    <button style="background-color: var(--green); width: 100%;" onclick="updateKeysAdded(${b.id}, '${prefix}', ${unitId})">Update: Keys Inside</button>
                </div>
            </details>
        `;
    }

    function renderBoxTemplate(b, isTaskPage = false) {
        let statusLabel = b.status === 'green' ? "Keys Inside" : (b.status === 'red' ? "Keys Missing" : "Pending Setup");

        let hmoMarkup = '';
        if (b.isHmo && b.units && b.units.length > 0) {
            const accordionPrefix = isTaskPage ? 'task-' : '';
            const isAccordionOpen = openAccordions.has(`${accordionPrefix}${b.id}`);

            hmoMarkup = `
                <button class="hmo-toggle-btn" id="hmo-btn-${accordionPrefix}${b.id}" onclick="toggleHmoAccordion(${b.id}, '${accordionPrefix}')">
                    <span>${isAccordionOpen ? '📂 Hide Flats / Units 🔼' : '📂 Show Flats / Units 🔽'}</span>
                </button>
                <div class="hmo-units-wrapper ${isAccordionOpen ? 'open' : ''}" id="hmo-wrapper-${accordionPrefix}${b.id}">
                    ${b.units.map(u => `
                        <div class="hmo-unit-box">
                            <div class="lockbox-header">
                                <h5 style="margin:0; font-size:13px; color: var(--zone-text);">🚪 ${u.unitName}</h5>
                                <span class="status-badge bg-${u.status}">${u.status === 'green' ? 'Keys Inside' : (u.status === 'red' ? 'Keys Missing' : 'Pending')}</span>
                            </div>

                            <div class="media-gallery">
                                ${(u.photos || []).map(p => `<img src="${p}" class="media-thumb" onclick="openMediaViewer('${p}', 'image')">`).join('')}
                                ${(u.videos || []).map(v => `<video src="${v}" class="media-thumb" onclick="openMediaViewer('${v}', 'video')"></video>`).join('')}
                            </div>

                            <div style="display:flex; gap:6px; margin-bottom:6px;">
                                <button class="btn-small" style="background:var(--section-bg); color:var(--text); border:1px solid var(--border);" onclick="addMoreMedia(${b.id}, 'photo', ${u.id})">+ Photo</button>
                                <button class="btn-small" style="background:var(--section-bg); color:var(--text); border:1px solid var(--border);" onclick="addMoreMedia(${b.id}, 'video', ${u.id})">+ Video</button>
                            </div>

                            ${renderSingleActionBlock(b, u, isTaskPage, u.id)}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        return `
            <div class="lockbox-item">
                <div class="lockbox-header">
                    <h4>🏢 ${b.name} ${b.isHmo ? '<span style="font-size:11px; color:var(--text-muted);">(HMO Main Building)</span>' : ''}</h4>
                    <span class="status-badge bg-${b.status}">${statusLabel}</span>
                </div>
                
                <div class="media-gallery">
                    ${(b.photos || []).map(p => `<img src="${p}" class="media-thumb" onclick="openMediaViewer('${p}', 'image')">`).join('')}
                    ${(b.videos || []).map(v => `<video src="${v}" class="media-thumb" onclick="openMediaViewer('${v}', 'video')">`).join('')}
                </div>

                <div style="display:flex; gap:6px; margin-bottom:8px;">
                    <button class="btn-small" style="background:var(--section-bg); color:var(--text); border:1px solid var(--border);" onclick="addMoreMedia(${b.id}, 'photo')">+ Photo</button>
                    <button class="btn-small" style="background:var(--section-bg); color:var(--text); border:1px solid var(--border);" onclick="addMoreMedia(${b.id}, 'video')">+ Video</button>
                </div>

                ${renderSingleActionBlock(b, b, isTaskPage, null)}
                ${hmoMarkup}

                <button style="background: transparent; color: var(--text-muted); width: auto; font-size: 11px; margin-top: 6px; padding: 2px 4px;" onclick="deleteBox(${b.id})">🗑 Delete Property</button>
            </div>
        `;
    }

    function renderBoxes() {
        const list = document.getElementById('boxList');
        const filter = (document.getElementById('searchFilter')?.value || '').toLowerCase().trim();
        list.innerHTML = '';

        const filtered = lockBoxes.filter(b => !filter || b.name.toLowerCase().includes(filter));

        if (filtered.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:12px;">No properties found.</p>';
            return;
        }

        const groups = {};
        filtered.forEach(b => {
            const z = b.zone || detectZone(b.name);
            groups[z] = groups[z] || [];
            groups[z].push(b);
        });

        for (const zone in groups) {
            const header = document.createElement('div');
            header.className = 'zone-header';
            header.innerHTML = `<span>📍 ${zone}</span> <span>(${groups[zone].length})</span>`;
            list.appendChild(header);

            groups[zone].forEach(b => {
                const item = document.createElement('div');
                item.innerHTML = renderBoxTemplate(b, false);
                list.appendChild(item);
            });
        }
    }

    function renderTasks() {
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';

        const pending = lockBoxes.filter(b => b.status !== 'green' || (b.isHmo && b.units.some(u => u.status !== 'green')));
        document.getElementById('alertCount').innerText = pending.length;
        document.getElementById('alertCount').style.display = pending.length ? 'inline' : 'none';

        if (!pending.length) {
            taskList.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:12px;">🎉 All set up!</p>';
            return;
        }

        pending.forEach(b => {
            const item = document.createElement('div');
            item.innerHTML = renderBoxTemplate(b, true);
            taskList.appendChild(item);
        });
    }

    renderBoxes();
    renderTasks();
    updateStats();
</script>

</body>
</html>
