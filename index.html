<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LockBox Key Manager</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --section-bg: #282828;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333333;
            --gray: #6c757d;
            --green: #28a745;
            --red: #dc3545;
            --primary: #0d6efd;
            --sidebar-bg: #181818;
            --input-bg: #2a2a2a;
            --zone-bg: #002b49;
            --zone-text: #6ea8fe;

            /* Professional Distinction Colors */
            --parent-header-bg: #1e293b; /* Slate Navy for Main Building */
            --parent-border: #334155;
            --unit-bg: #1e2030;          /* Deep Indigo/Gray for Sub-Units/Flats */
            --unit-border: #4f46e5;
        }

        body.light-mode {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --section-bg: #f8f9fa;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --sidebar-bg: #e9ecef;
            --input-bg: #ffffff;
            --zone-bg: #e7f1ff;
            --zone-text: #0a58ca;

            --parent-header-bg: #e2e8f0;
            --parent-border: #cbd5e1;
            --unit-bg: #f0f3ff;
            --unit-border: #6366f1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 60px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            gap: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            box-sizing: border-box;
            z-index: 100;
        }

        .nav-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            background: transparent;
            color: var(--text);
            border: none;
            position: relative;
            transition: background 0.2s;
        }

        .nav-icon.active {
            background-color: var(--primary);
            color: #fff;
        }

        .badge-alert {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 10px;
        }

        /* Main App Area */
        .app-wrapper {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: max-width 0.3s;
        }

        .container {
            width: 100%;
            max-width: 480px; /* Phone view default */
            transition: max-width 0.3s;
        }

        body.pc-mode .container {
            max-width: 900px; /* PC layout view */
        }

        /* Header Toolbar */
        .top-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        .top-toolbar h1 {
            font-size: 18px;
            margin: 0;
        }

        .tool-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .card h3 {
            font-size: 14px;
            margin: 0 0 10px 0;
            color: var(--text);
        }

        .address-row {
            display: flex;
            gap: 6px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text);
            box-sizing: border-box;
            font-size: 13px;
        }

        label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            background-color: var(--primary);
            color: #fff;
        }

        .btn-small {
            width: auto;
            padding: 4px 8px;
            font-size: 11px;
            display: inline-block;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
        }

        .bg-gray { background-color: var(--gray); }
        .bg-green { background-color: var(--green); }
        .bg-red { background-color: var(--red); }

        /* Zone / Area Headers */
        .zone-header {
            background-color: var(--zone-bg);
            color: var(--zone-text);
            font-size: 13px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 14px 0 8px 0;
            border-left: 4px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zone-header:first-child {
            margin-top: 0;
        }

        /* Parent Property Item Styling */
        .lockbox-item {
            background-color: var(--parent-header-bg);
            border: 1px solid var(--parent-border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .lockbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .lockbox-header h4 {
            margin: 0;
            font-size: 15px;
            color: var(--text);
        }

        /* HMO Sub-units container */
        .hmo-toggle-btn {
            background-color: var(--section-bg);
            color: var(--text);
            border: 1px solid var(--border);
            margin: 8px 0;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hmo-units-wrapper {
            display: none; /* Collapsed by default */
            margin-top: 8px;
            padding-left: 6px;
            border-left: 2px dashed var(--unit-border);
        }

        .hmo-units-wrapper.open {
            display: block;
        }

        .hmo-unit-box {
            background-color: var(--unit-bg);
            border-left: 4px solid var(--unit-border);
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
        }

        .code-display-box {
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px dashed var(--primary);
            padding: 6px 8px;
            border-radius: 6px;
            margin: 6px 0;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-display-box span.code-num {
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            color: var(--zone-text);
            letter-spacing: 1px;
        }

        .media-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
        }

        .media-thumb {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border);
            background-color: #000;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 6px 0;
            font-size: 12px;
        }

        .checkbox-group input {
            width: auto;
            margin: 0;
        }

        .log-info {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--section-bg);
            padding: 6px 8px;
            border-radius: 4px;
            margin: 6px 0;
            border-left: 3px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 11px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }

        .action-block {
            background-color: var(--section-bg);
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 8px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        .note-input {
            display: none;
        }

        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            max-width: 440px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--text);
        }

        .close-btn {
            background: transparent;
            color: var(--text-muted);
            font-size: 18px;
            width: auto;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }

        .history-list-item {
            font-size: 11px;
            border-bottom: 1px solid var(--border);
            padding: 6px 0;
        }

        .history-list-item:last-child {
            border-bottom: none;
        }

        .viewer-media {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<!-- Left Navigation Sidebar -->
<div class="sidebar">
    <button id="navHome" class="nav-icon active" onclick="switchTab('home')" title="Main Properties">🏠</button>
    <button id="navTasks" class="nav-icon" onclick="switchTab('tasks')" title="Action Required / Missing Keys">
        ⚠️
        <span id="alertCount" class="badge-alert" style="display:none;">0</span>
    </button>
</div>

<!-- Main Content Area -->
<div class="app-wrapper">
    <div class="container">
        
        <!-- Header Toolbar -->
        <div class="top-toolbar">
            <h1 id="pageHeading">🏠 LockBox Manager</h1>
            <div class="tool-btns">
                <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Toggle Light/Dark Mode">🌙</button>
                <button class="icon-btn" onclick="toggleViewMode()" id="viewModeBtn" title="Toggle PC/Phone Layout">📱</button>
            </div>
        </div>

        <!-- PAGE 1: MAIN INVENTORY -->
        <div id="pageHome" class="page-view active">
            <!-- Add Lockbox Form -->
            <div class="card">
                <h3>+ Add New Property LockBox</h3>
                <div class="address-row">
                    <input type="text" id="boxName" placeholder="Full Address with Postcode (e.g. 69 Piedmont, London N17 6RY)">
                    <button class="icon-btn" style="width: auto; height: 35px; margin-top: 4px;" onclick="findAddress()" title="Find / Map Address">🔍</button>
                </div>

                <label>Initial LockBox Code (Optional):</label>
                <input type="text" id="initialCode" placeholder="e.g. 4589 or C1234X">

                <!-- HMO Multi-Unit Toggle -->
                <div class="checkbox-group" style="margin: 8px 0;">
                    <input type="checkbox" id="isHmo" onchange="toggleHmoOptions()">
                    <label for="isHmo" style="font-weight: bold; font-size: 12px; color: var(--text);">Is this an HMO / Multi-Unit Building (Flats / Rooms)?</label>
                </div>

                <div id="hmoInputs" style="display:none; background: var(--section-bg); padding: 8px; border-radius: 6px; margin-bottom: 8px;">
                    <label>Number of Flats / Rooms:</label>
                    <input type="number" id="hmoCount" min="1" max="20" value="4" placeholder="Number of units (e.g. 6)">
                    <label>Naming Prefix:</label>
                    <select id="hmoPrefix">
                        <option value="Flat">Flat (e.g. Flat 1, Flat 2)</option>
                        <option value="Room">Room (e.g. Room 1, Room 2)</option>
                        <option value="Unit">Unit (e.g. Unit 1, Unit 2)</option>
                    </select>
                </div>
                
                <label>Add Building Photos:</label>
                <input type="file" id="boxPhoto" accept="image/*" multiple>
                
                <label>Add Building Video:</label>
                <input type="file" id="boxVideo" accept="video/*" capture="environment">

                <button onclick="addLockBox()" style="margin-top: 8px;">Save Property</button>
            </div>

            <!-- Inventory Search Bar -->
            <input type="text" id="searchFilter" onkeyup="handleSearch()" placeholder="🔍 Search address or flat (e.g. 69 piedmont)..." style="margin-bottom: 12px;">

            <!-- Inventory List -->
            <div id="boxList"></div>
        </div>

        <!-- PAGE 2: ACTION REQUIRED (MISSING KEYS & PENDING SETUP JOBS) -->
        <div id="pageTasks" class="page-view">
            <div class="card" style="border-left: 4px solid var(--red);">
                <h3>⚠️ Action Required: Pending Setup & Missing Keys</h3>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
                    Properties requiring attention (Pending initial setup or missing keys). Update codes, add keys, or log actions to resolve.
                </p>
                <div id="taskList"></div>
            </div>
        </div>

    </div>
</div>

<!-- History Modal -->
<div id="historyModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalBoxTitle">📜 Action History</h3>
            <button class="close-btn" onclick="closeModal('historyModal')">✕</button>
        </div>
        <div id="modalHistoryContent"></div>
    </div>
</div>

<!-- Media Viewer Modal -->
<div id="mediaModal" class="modal-overlay" onclick="closeModal('mediaModal')">
    <div id="mediaViewerContent" style="text-align: center;"></div>
</div>

<script>
    let lockBoxes = JSON.parse(localStorage.getItem('myLockBoxes')) || [];
    let isDarkMode = localStorage.getItem('isDarkMode') !== 'false';
    let isPcMode = localStorage.getItem('isPcMode') === 'true';

    // Track active expanded accordions so edits don't close them
    let openAccordions = new Set();

    if (!isDarkMode) document.body.classList.add('light-mode');
    if (isPcMode) document.body.classList.add('pc-mode');
    updateToolbarIcons();

    function detectZone(address) {
        if (!address) return "General Area";
        const upper = address.toUpperCase();

        if (/\bEN1\b|\bEN2\b|\bEN3\b/.test(upper) || upper.includes("ENFIELD")) return "Enfield Zone";
        if (/\bEN9\b/.test(upper) || upper.includes("WALTHAM ABBEY") || upper.includes("EPPING FOREST")) return "Epping Forest District";
        if (/\bEN6\b/.test(upper) || upper.includes("POTTERS BAR") || upper.includes("HERTSMERE")) return "Hertsmere Borough";
        if (/\bN15\b|\bN17\b|\bN8\b/.test(upper) || upper.includes("HARINGEY") || upper.includes("TOTTENHAM") || upper.includes("PIEDMONT")) return "Haringey Zone";
        if (/\bE4\b|\bE11\b|\bE17\b/.test(upper) || upper.includes("WALTHAM FOREST") || upper.includes("WALTHAMSTOW")) return "Waltham Forest Zone";
        if (/\bN9\b|\bN18\b/.test(upper) || upper.includes("EDMONTON")) return "Edmonton / Enfield South";
        if (/\bEN8\b/.test(upper) || upper.includes("WALTHAM CROSS")) return "Waltham Cross Zone";

        const postalMatch = upper.match(/\b([A-Z]{1,2}[0-9]{1,2})\b/);
        if (postalMatch && postalMatch[1]) {
            return `Zone ${postalMatch[1]}`;
        }

        return "Other Area";
    }

    function toggleHmoOptions() {
        const isHmo = document.getElementById('isHmo').checked;
        document.getElementById('hmoInputs').style.display = isHmo ? 'block' : 'none';
    }

    function toggleHmoAccordion(id, prefix = '') {
        const accordionKey = `${prefix}${id}`;
        if (openAccordions.has(accordionKey)) {
            openAccordions.delete(accordionKey);
        } else {
            openAccordions.add(accordionKey);
        }

        const wrapper = document.getElementById(`hmo-wrapper-${prefix}${id}`);
        const btn = document.getElementById(`hmo-btn-${prefix}${id}`);
        if (wrapper) {
            wrapper.classList.toggle('open');
            const isOpen = wrapper.classList.contains('open');
            btn.innerHTML = isOpen ? '<span>📂 Hide Flats / Units 🔼</span>' : '<span>📂 Show Flats / Units 🔽</span>';
        }
    }

    function saveAndRender() {
        localStorage.setItem('myLockBoxes', JSON.stringify(lockBoxes));
        renderBoxes();
        renderTasks();
    }

    function handleSearch() {
        openAccordions.clear(); // Collapse all when typing a search filter
        renderBoxes();
    }

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        localStorage.setItem('isDarkMode', isDarkMode);
        document.body.classList.toggle('light-mode', !isDarkMode);
        updateToolbarIcons();
    }

    function toggleViewMode() {
        isPcMode = !isPcMode;
        localStorage.setItem('isPcMode', isPcMode);
        document.body.classList.toggle('pc-mode', isPcMode);
        updateToolbarIcons();
    }

    function updateToolbarIcons() {
        document.getElementById('themeBtn').innerText = isDarkMode ? '☀️' : '🌙';
        document.getElementById('viewModeBtn').innerText = isPcMode ? '💻' : '📱';
    }

    function switchTab(tab) {
        openAccordions.clear(); // Collapse all accordions when changing tabs

        document.getElementById('navHome').classList.toggle('active', tab === 'home');
        document.getElementById('navTasks').classList.toggle('active', tab === 'tasks');

        document.getElementById('pageHome').classList.toggle('active', tab === 'home');
        document.getElementById('pageTasks').classList.toggle('active', tab === 'tasks');

        document.getElementById('pageHeading').innerText = tab === 'home' ? '🏠 LockBox Manager' : '⚠️ Action Required';
    }

    function findAddress() {
        const query = document.getElementById('boxName').value.trim();
        if (!query) return alert('Please type an address to search!');
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, '_blank');
    }

    async function addLockBox() {
        const name = document.getElementById('boxName').value.trim();
        const code = document.getElementById('initialCode').value.trim() || 'Not Set';
        const photoInput = document.getElementById('boxPhoto');
        const videoInput = document.getElementById('boxVideo');

        if (!name) return alert('Please enter a property address or name!');

        const photoDataArray = [];
        if (photoInput.files && photoInput.files.length > 0) {
            for (let file of photoInput.files) {
                photoDataArray.push(await readFileAsDataURL(file));
            }
        }

        const videoDataArray = [];
        if (videoInput.files && videoInput.files.length > 0) {
            for (let file of videoInput.files) {
                videoDataArray.push(await readFileAsDataURL(file));
            }
        }

        const isHmo = document.getElementById('isHmo').checked;
        const units = [];

        if (isHmo) {
            const count = parseInt(document.getElementById('hmoCount').value) || 1;
            const prefix = document.getElementById('hmoPrefix').value;
            for (let i = 1; i <= count; i++) {
                units.push({
                    id: Date.now() + i,
                    unitName: `${prefix} ${i}`,
                    code: code,
                    status: 'gray',
                    lastAction: 'Pending initial setup.',
                    actionTime: new Date().toLocaleString(),
                    history: [{ action: `Unit added. Code: ${code}`, time: new Date().toLocaleString() }]
                });
            }
        }

        const zone = detectZone(name);
        const now = new Date().toLocaleString();

        lockBoxes.push({
            id: Date.now(),
            name: name,
            zone: zone,
            code: code,
            isHmo: isHmo,
            units: units,
            photos: photoDataArray,
            videos: videoDataArray,
            status: 'gray',
            lastAction: 'Pending initial setup.',
            actionTime: now,
            history: [{ action: `Property created. Code set to: ${code}`, time: now }]
        });

        document.getElementById('boxName').value = '';
        document.getElementById('initialCode').value = '';
        document.getElementById('boxPhoto').value = '';
        document.getElementById('boxVideo').value = '';
        document.getElementById('isHmo').checked = false;
        toggleHmoOptions();
        saveAndRender();
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    }

    async function addMoreMedia(id, type, unitId = null) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = type === 'photo' ? 'image/*' : 'video/*';
        if (type === 'video') input.capture = 'environment';
        input.multiple = true;

        input.onchange = async (e) => {
            const box = lockBoxes.find(b => b.id === id);
            if (!box) return;

            let target = box;
            if (unitId) {
                target = box.units.find(u => u.id === unitId);
                // Keep accordion open
                openAccordions.add(`${id}`);
                openAccordions.add(`task-${id}`);
            }

            if (type === 'photo') {
                if (!target.photos) target.photos = [];
                for (let file of e.target.files) {
                    target.photos.push(await readFileAsDataURL(file));
                }
            } else {
                if (!target.videos) target.videos = [];
                for (let file of e.target.files) {
                    target.videos.push(await readFileAsDataURL(file));
                }
            }
            saveAndRender();
        };

        input.click();
    }

    function updateCode(id, prefix = '', unitId = null) {
        const targetKey = unitId ? `${prefix}unit-${unitId}-` : prefix;
        const newCode = document.getElementById(`${targetKey}code-input-${id}`).value.trim();

        if (!newCode) return alert('Please enter a valid code!');

        const box = lockBoxes.find(b => b.id === id);
        let target = box;
        if (unitId) {
            target = box.units.find(u => u.id === unitId);
            openAccordions.add(`${prefix}${id}`);
        }

        const oldCode = target.code || 'Not Set';
        target.code = newCode;
        const now = new Date().toLocaleString();

        const logEntry = `LockBox code changed from [${oldCode}] to [${newCode}]`;
        target.lastAction = logEntry;
        target.actionTime = now;

        if (!target.history) target.history = [];
        target.history.unshift({ action: logEntry, time: now });

        saveAndRender();
    }

    function toggleReasonNote(id, section, prefix = '') {
        const reasonSelect = document.getElementById(`${prefix}reason-${section}-${id}`).value;
        const noteField = document.getElementById(`${prefix}note-${section}-${id}`);
        if (reasonSelect === 'Other') {
            noteField.style.display = 'block';
        } else {
            noteField.style.display = 'none';
        }
    }

    function updateKeysGiven(id, prefix = '', unitId = null) {
        const targetKey = unitId ? `${prefix}unit-${unitId}-` : prefix;
        const staff = document.getElementById(`${targetKey}staff-give-${id}`).value;
        const reasonSelect = document.getElementById(`${targetKey}reason-give-${id}`).value;
        const customNote = document.getElementById(`${targetKey}note-give-${id}`).value.trim();
        const isChecked = document.getElementById(`${targetKey}check-give-${id}`).checked;

        if (!isChecked) return alert('Please check the box confirming keys were removed!');

        let fullReason = reasonSelect;
        if (reasonSelect === 'Other') {
            if (!customNote) return alert('Please type a note explaining the reason!');
            fullReason = `Other: ${customNote}`;
        }

        // Check if options exist for parent HMO key types
        const targetFlatSelect = document.getElementById(`${targetKey}target-flat-give-${id}`);
        const targetKeyTypeSelect = document.getElementById(`${targetKey}key-type-give-${id}`);

        let extraDetail = '';
        if (targetFlatSelect && targetKeyTypeSelect) {
            extraDetail = ` [For: ${targetFlatSelect.value} | Key Type: ${targetKeyTypeSelect.value}]`;
        }

        const now = new Date().toLocaleString();
        const box = lockBoxes.find(b => b.id === id);
        let target = box;
        if (unitId) {
            target = box.units.find(u => u.id === unitId);
            openAccordions.add(`${prefix}${id}`);
        }

        const logEntry = `Keys removed by ${staff}${extraDetail} [Reason: ${fullReason}] (Code used: ${target.code || 'N/A'})`;
        target.status = 'red';
        target.lastAction = logEntry;
        target.actionTime = now;

        if (!target.history) target.history = [];
        target.history.unshift({ action: logEntry, time: now });

        saveAndRender();
    }

    function updateKeysAdded(id, prefix = '', unitId = null) {
        const targetKey = unitId ? `${prefix}unit-${unitId}-` : prefix;
        const staff = document.getElementById(`${targetKey}staff-add-${id}`).value;
        const reasonSelect = document.getElementById(`${targetKey}reason-add-${id}`).value;
        const customNote = document.getElementById(`${targetKey}note-add-${id}`).value.trim();
        const isChecked = document.getElementById(`${targetKey}check-add-${id}`).checked;

        if (!isChecked) return alert('Please check the box confirming keys are inside!');

        let fullReason = reasonSelect;
        if (reasonSelect === 'Other') {
            if (!customNote) return alert('Please type a note explaining the reason!');
            fullReason = `Other: ${customNote}`;
        }

        // Check if options exist for parent HMO key types
        const targetFlatSelect = document.getElementById(`${targetKey}target-flat-add-${id}`);
        const targetKeyTypeSelect = document.getElementById(`${targetKey}key-type-add-${id}`);

        let extraDetail = '';
        if (targetFlatSelect && targetKeyTypeSelect) {
            extraDetail = ` [For: ${targetFlatSelect.value} | Key Type: ${targetKeyTypeSelect.value}]`;
        }

        const now = new Date().toLocaleString();
        const box = lockBoxes.find(b => b.id === id);
        let target = box;
        if (unitId) {
            target = box.units.find(u => u.id === unitId);
            openAccordions.add(`${prefix}${id}`);
        }

        const logEntry = `Keys added by ${staff}${extraDetail} [Note: ${fullReason}] (Code set: ${target.code || 'N/A'})`;
        target.status = 'green';
        target.lastAction = logEntry;
        target.actionTime = now;

        if (!target.history) target.history = [];
        target.history.unshift({ action: logEntry, time: now });

        saveAndRender();
    }

    function openHistory(id, unitId = null) {
        const box = lockBoxes.find(b => b.id === id);
        if (!box) return;

        let target = box;
        let title = box.name;
        if (unitId) {
            target = box.units.find(u => u.id === unitId);
            title = `${box.name} - ${target.unitName}`;
        }

        document.getElementById('modalBoxTitle').innerText = `📜 History: ${title}`;
        const container = document.getElementById('modalHistoryContent');
        container.innerHTML = '';

        if (!target.history || target.history.length === 0) {
            container.innerHTML = '<p style="font-size:12px; color:var(--text-muted);">No recorded history yet.</p>';
        } else {
            target.history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-list-item';
                div.innerHTML = `
                    <strong>${item.action}</strong><br>
                    <span style="color:var(--text-muted); font-size:10px;">🕒 ${item.time}</span>
                `;
                container.appendChild(div);
            });
        }

        document.getElementById('historyModal').style.display = 'flex';
    }

    function openMediaViewer(src, type) {
        const content = document.getElementById('mediaViewerContent');
        if (type === 'image') {
            content.innerHTML = `<img src="${src}" class="viewer-media">`;
        } else {
            content.innerHTML = `<video src="${src}" class="viewer-media" controls autoplay></video>`;
        }
        document.getElementById('mediaModal').style.display = 'flex';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
        if (id === 'mediaModal') {
            document.getElementById('mediaViewerContent').innerHTML = '';
        }
    }

    function deleteBox(id) {
        if (confirm("Delete this property LockBox?")) {
            lockBoxes = lockBoxes.filter(b => b.id !== id);
            saveAndRender();
        }
    }

    function renderSingleActionBlock(b, targetObj, isTaskPage, unitId = null) {
        const prefix = isTaskPage ? 'task-' : '';
        const keyPrefix = unitId ? `${prefix}unit-${unitId}-` : prefix;
        const isParentHmo = b.isHmo && !unitId;

        // Build flat dropdown options if this is the parent HMO lockbox
        let flatOptionsHtml = '';
        if (isParentHmo && b.units) {
            flatOptionsHtml = `<option value="Whole Building / General">For: Whole Building / General</option>` +
                b.units.map(u => `<option value="${u.unitName}">For: ${u.unitName}</option>`).join('');
        }

        return `
            <!-- Code Management Box -->
            <div class="code-display-box">
                <div>🔑 Code: <span class="code-num">${targetObj.code || 'Not Set'}</span></div>
                <div style="display:flex; gap:4px; align-items:center;">
                    <input type="text" id="${keyPrefix}code-input-${b.id}" placeholder="New code" style="width: 80px; padding: 3px 6px; margin: 0; font-size: 11px;">
                    <button class="btn-small" style="padding: 3px 6px;" onclick="updateCode(${b.id}, '${prefix}', ${unitId})">Set Code</button>
                </div>
            </div>

            <div class="log-info">
                <div>
                    <strong>Last Action:</strong> ${targetObj.lastAction}<br>
                    ${targetObj.actionTime ? `<span>🕒 ${targetObj.actionTime}</span>` : ''}
                </div>
                <button class="history-btn" onclick="openHistory(${b.id}, ${unitId})">📜 History</button>
            </div>

            ${!isTaskPage ? `
            <div class="action-block" style="border-left: 3px solid var(--red);">
                <div class="section-title">🔑 Give Keys / Remove Keys</div>
                
                ${isParentHmo ? `
                <!-- Parent HMO Specific Dropdowns -->
                <select id="${keyPrefix}target-flat-give-${b.id}">
                    ${flatOptionsHtml}
                </select>

                <select id="${keyPrefix}key-type-give-${b.id}">
                    <option value="Flat Key">Key Type: Flat Key</option>
                    <option value="Main Door Key">Key Type: Main Door Key</option>
                    <option value="Both Keys (Flat + Main Door)">Key Type: Both Keys (Flat + Main Door)</option>
                    <option value="Master Code / LockBox Code">Key Type: LockBox Code Shared</option>
                </select>
                ` : ''}

                <select id="${keyPrefix}staff-give-${b.id}">
                    <option value="Alex">By: Alex</option>
                    <option value="Denis">By: Denis</option>
                </select>

                <select id="${keyPrefix}reason-give-${b.id}" onchange="toggleReasonNote(${b.id}, 'give', '${keyPrefix}')">
                    <option value="Tenant Moved In">Reason: Tenant Moved In</option>
                    <option value="Tenant Lost Keys (Code Given)">Reason: Tenant Lost Keys (Access Code Given)</option>
                    <option value="Flat LockBox Empty - Supplied from Parent">Reason: Flat LockBox Empty (Supplied from Main LockBox)</option>
                    <option value="Other">Reason: Other (Type Below)</option>
                </select>

                <input type="text" id="${keyPrefix}note-give-${b.id}" class="note-input" placeholder="Enter reason here...">

                <div class="checkbox-group">
                    <input type="checkbox" id="${keyPrefix}check-give-${b.id}">
                    <label for="${keyPrefix}check-give-${b.id}">Keys out (LockBox empty)</label>
                </div>

                <button style="background-color: var(--red);" onclick="updateKeysGiven(${b.id}, '${prefix}', ${unitId})">Update: Keys Out (Empty)</button>
            </div>
            ` : ''}

            <div class="action-block" style="border-left: 3px solid var(--green);">
                <div class="section-title">📥 Restock / Add Keys</div>
                
                ${isParentHmo ? `
                <!-- Parent HMO Specific Dropdowns for Restock -->
                <select id="${keyPrefix}target-flat-add-${b.id}">
                    ${flatOptionsHtml}
                </select>

                <select id="${keyPrefix}key-type-add-${b.id}">
                    <option value="Flat Key">Key Type: Flat Key</option>
                    <option value="Main Door Key">Key Type: Main Door Key</option>
                    <option value="Both Keys (Flat + Main Door)">Key Type: Both Keys (Flat + Main Door)</option>
                </select>
                ` : ''}

                <select id="${keyPrefix}staff-add-${b.id}">
                    <option value="Alex">By: Alex</option>
                    <option value="Denis">By: Denis</option>
                </select>

                <select id="${keyPrefix}reason-add-${b.id}" onchange="toggleReasonNote(${b.id}, 'add', '${keyPrefix}')">
                    <option value="Refilled / Standard">Reason: Refilled / Standard</option>
                    <option value="Added Spare Keys">Reason: Added Spare Keys</option>
                    <option value="Other">Reason: Other (Type Below)</option>
                </select>

                <input type="text" id="${keyPrefix}note-add-${b.id}" class="note-input" placeholder="Enter reason/note here...">

                <div class="checkbox-group">
                    <input type="checkbox" id="${keyPrefix}check-add-${b.id}">
                    <label for="${keyPrefix}check-add-${b.id}">Keys placed inside LockBox</label>
                </div>

                <button style="background-color: var(--green);" onclick="updateKeysAdded(${b.id}, '${prefix}', ${unitId})">Update: Keys Inside</button>
            </div>
        `;
    }

    function renderBoxTemplate(b, isTaskPage = false, taskFilterStatus = null) {
        let statusLabel = "Pending Setup (Attention Needed)";
        if (b.status === 'green') statusLabel = "Keys Inside";
        if (b.status === 'red') statusLabel = "Keys Missing";

        const photos = b.photos || [];
        const videos = b.videos || [];

        const accordionPrefix = isTaskPage ? 'task-' : '';
        const accordionKey = `${accordionPrefix}${b.id}`;
        const isAccordionOpen = isTaskPage || openAccordions.has(accordionKey);

        let hmoMarkup = '';
        if (b.isHmo && b.units && b.units.length > 0) {
            let unitsToDisplay = b.units;
            if (isTaskPage && taskFilterStatus) {
                unitsToDisplay = b.units.filter(u => u.status === taskFilterStatus);
            }

            if (unitsToDisplay.length > 0) {
                hmoMarkup = `
                    <button class="hmo-toggle-btn" id="hmo-btn-${accordionPrefix}${b.id}" onclick="toggleHmoAccordion(${b.id}, '${accordionPrefix}')">
                        <span>${isAccordionOpen ? '📂 Hide Flats / Units 🔼' : '📂 Show Flats / Units 🔽'}</span>
                    </button>
                    <div class="hmo-units-wrapper ${isAccordionOpen ? 'open' : ''}" id="hmo-wrapper-${accordionPrefix}${b.id}">
                        ${unitsToDisplay.map(u => {
                            let unitStatusLabel = "Pending Setup (Attention Needed)";
                            if (u.status === 'green') unitStatusLabel = "Keys Inside";
                            if (u.status === 'red') unitStatusLabel = "Keys Missing";

                            const uPhotos = u.photos || [];
                            const uVideos = u.videos || [];

                            return `
                                <div class="hmo-unit-box">
                                    <div class="lockbox-header">
                                        <h5 style="margin:0; font-size:13px; color: var(--zone-text);">🚪 ${u.unitName}</h5>
                                        <span class="status-badge bg-${u.status}">${unitStatusLabel}</span>
                                    </div>

                                    <div class="media-gallery">
                                        ${uPhotos.map(p => `<img src="${p}" class="media-thumb" onclick="openMediaViewer('${p}', 'image')">`).join('')}
                                        ${uVideos.map(v => `<video src="${v}" class="media-thumb" onclick="openMediaViewer('${v}', 'video')"></video>`).join('')}
                                    </div>

                                    <div style="display:flex; gap:6px; margin-bottom:6px;">
                                        <button class="btn-small" style="background:var(--section-bg); color:var(--text); border:1px solid var(--border);" onclick="addMoreMedia(${b.id}, 'photo', ${u.id})">+ Photo</button>
                                        <button class="btn-small" style="background:var(--section-bg); color:var(--text); border:1px solid var(--border);" onclick="addMoreMedia(${b.id}, 'video', ${u.id})">+ Video</button>
                                    </div>

                                    ${renderSingleActionBlock(b, u, isTaskPage, u.id)}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        const showParentBlock = !isTaskPage || (isTaskPage && b.status === taskFilterStatus);

        return `
            <div class="lockbox-item">
                <div class="lockbox-header">
                    <h4>🏢 ${b.name} ${b.isHmo ? '<span style="font-size:11px; color:var(--text-muted);">(HMO Main Building)</span>' : ''}</h4>
                    <span class="status-badge bg-${b.status}">${statusLabel}</span>
                </div>
                
                <!-- Main Building Media -->
                <div class="media-gallery">
                    ${photos.map(p => `<img src="${p}" class="media-thumb" onclick="openMediaViewer('${p}', 'image')">`).join('')}
                    ${videos.map(v => `<video src="${v}" class="media-thumb" onclick="openMediaViewer('${v}', 'video')"></video>`).join('')}
                </div>

                <div style="display:flex; gap:6px; margin-bottom:8px;">
                    <button class="btn-small" style="background:var(--section-bg); color:var(--text); border:1px solid var(--border);" onclick="addMoreMedia(${b.id}, 'photo')">+ Photo</button>
                    <button class="btn-small" style="background:var(--section-bg); color:var(--text); border:1px solid var(--border);" onclick="addMoreMedia(${b.id}, 'video')">+ Video</button>
                </div>

                <!-- Always render parent code, history, and key actions -->
                ${showParentBlock ? renderSingleActionBlock(b, b, isTaskPage, null) : ''}

                <!-- Collapsible HMO Units -->
                ${hmoMarkup}

                <button style="background: transparent; color: var(--text-muted); width: auto; font-size: 11px; margin-top: 6px; padding: 2px 4px;" onclick="deleteBox(${b.id})">🗑 Delete Property</button>
            </div>
        `;
    }

    function groupBoxesByZone(boxes) {
        const groups = {};
        boxes.forEach(b => {
            const z = b.zone || detectZone(b.name);
            if (!groups[z]) groups[z] = [];
            groups[z].push(b);
        });
        return groups;
    }

    function renderBoxes() {
        const list = document.getElementById('boxList');
        const filter = (document.getElementById('searchFilter')?.value || '').toLowerCase().trim();
        list.innerHTML = '';

        if (lockBoxes.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:12px;">No properties added yet.</p>';
            return;
        }

        const filtered = lockBoxes.filter(b => {
            if (!filter) return true;
            const nameMatch = b.name.toLowerCase().includes(filter);
            const unitMatch = b.isHmo && b.units && b.units.some(u => u.unitName.toLowerCase().includes(filter));
            return nameMatch || unitMatch;
        });

        if (filtered.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:12px;">No properties match your search.</p>';
            return;
        }

        const grouped = groupBoxesByZone(filtered);

        for (const zoneName in grouped) {
            const zoneHeader = document.createElement('div');
            zoneHeader.className = 'zone-header';
            zoneHeader.innerHTML = `<span>📍 ${zoneName}</span> <span>(${grouped[zoneName].length})</span>`;
            list.appendChild(zoneHeader);

            grouped[zoneName].forEach(b => {
                const item = document.createElement('div');
                item.innerHTML = renderBoxTemplate(b, false);
                list.appendChild(item);
            });
        }
    }

    function renderTasks() {
        const taskList = document.getElementById('taskList');
        const alertBadge = document.getElementById('alertCount');
        taskList.innerHTML = '';

        let redAlertCount = 0;
        let grayAlertCount = 0;

        lockBoxes.forEach(b => {
            if (b.isHmo && b.units) {
                redAlertCount += b.units.filter(u => u.status === 'red').length;
                grayAlertCount += b.units.filter(u => u.status === 'gray').length;
            }
            if (b.status === 'red') redAlertCount++;
            if (b.status === 'gray') grayAlertCount++;
        });

        const totalAttentionNeeded = redAlertCount + grayAlertCount;

        if (totalAttentionNeeded === 0) {
            alertBadge.style.display = 'none';
            taskList.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:12px;">🎉 All LockBoxes are set up and stocked!</p>';
            return;
        }

        alertBadge.style.display = 'inline';
        alertBadge.innerText = totalAttentionNeeded;

        // SECTION 1: RED TASKS (MISSING KEYS)
        if (redAlertCount > 0) {
            const redTitle = document.createElement('div');
            redTitle.style.cssText = "font-weight:bold; color:var(--red); font-size:14px; margin: 10px 0 6px 0; padding-bottom:4px; border-bottom:1px solid var(--red);";
            redTitle.innerText = `🚨 Keys Missing / Empty LockBoxes (${redAlertCount})`;
            taskList.appendChild(redTitle);

            const redBoxes = lockBoxes.filter(b => (b.isHmo && b.units.some(u => u.status === 'red')) || b.status === 'red');
            redBoxes.forEach(b => {
                const item = document.createElement('div');
                item.innerHTML = renderBoxTemplate(b, true, 'red');
                taskList.appendChild(item);
            });
        }

        // SECTION 2: GRAY TASKS (PENDING INITIAL SETUP)
        if (grayAlertCount > 0) {
            const grayTitle = document.createElement('div');
            grayTitle.style.cssText = "font-weight:bold; color:var(--gray); font-size:14px; margin: 20px 0 6px 0; padding-bottom:4px; border-bottom:1px solid var(--gray);";
            grayTitle.innerText = `⚙️ Pending Initial Setup / Unfilled (${grayAlertCount})`;
            taskList.appendChild(grayTitle);

            const grayBoxes = lockBoxes.filter(b => (b.isHmo && b.units.some(u => u.status === 'gray')) || b.status === 'gray');
            grayBoxes.forEach(b => {
                const item = document.createElement('div');
                item.innerHTML = renderBoxTemplate(b, true, 'gray');
                taskList.appendChild(item);
            });
        }
    }

    renderBoxes();
    renderTasks();
</script>

</body>
</html>
