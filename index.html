<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LockBox Key Manager</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --section-bg: #282828;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333333;
            --gray: #6c757d;
            --green: #28a745;
            --red: #dc3545;
            --primary: #0d6efd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            text-align: center;
            font-size: 18px;
            margin: 10px 0 15px 0;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .card h3 {
            font-size: 14px;
            margin: 0 0 10px 0;
            color: #fff;
        }

        input[type="text"], select {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 13px;
        }

        input[type="file"] {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            background-color: var(--primary);
            color: #fff;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
        }

        .bg-gray { background-color: var(--gray); }
        .bg-green { background-color: var(--green); }
        .bg-red { background-color: var(--red); }

        .lockbox-item {
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .lockbox-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .lockbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .lockbox-header h4 {
            margin: 0;
            font-size: 15px;
            color: #fff;
        }

        .lockbox-img {
            width: 100%;
            max-height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin: 6px 0;
            background-color: #000;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 6px 0;
            font-size: 12px;
        }

        .checkbox-group input {
            width: auto;
            margin: 0;
        }

        .log-info {
            font-size: 11px;
            color: var(--text-muted);
            background: #181818;
            padding: 6px 8px;
            border-radius: 4px;
            margin: 6px 0;
            border-left: 3px solid var(--primary);
        }

        .action-block {
            background-color: var(--section-bg);
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 8px;
            border: 1px solid #333;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
        }

        .note-input {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 LockBox Key Manager</h1>

    <!-- Add Lockbox Form -->
    <div class="card">
        <h3>+ Add New LockBox</h3>
        <input type="text" id="boxName" placeholder="LockBox Name / Location (e.g., Flat 1)">
        <input type="file" id="boxPhoto" accept="image/*">
        <button onclick="addLockBox()">Save LockBox</button>
    </div>

    <!-- LockBox Inventory List -->
    <div class="card">
        <h3>LockBox Inventory</h3>
        <div id="boxList"></div>
    </div>
</div>

<script>
    let lockBoxes = JSON.parse(localStorage.getItem('myLockBoxes')) || [];

    function saveAndRender() {
        localStorage.setItem('myLockBoxes', JSON.stringify(lockBoxes));
        renderBoxes();
    }

    function addLockBox() {
        const name = document.getElementById('boxName').value.trim();
        const photoInput = document.getElementById('boxPhoto');

        if (!name) return alert('Please enter a LockBox name!');

        if (photoInput.files && photoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                createBoxObject(name, e.target.result);
            };
            reader.readAsDataURL(photoInput.files[0]);
        } else {
            createBoxObject(name, '');
        }
    }

    function createBoxObject(name, photoData) {
        lockBoxes.push({
            id: Date.now(),
            name: name,
            photo: photoData,
            status: 'gray',
            lastAction: 'No actions logged yet.',
            actionTime: ''
        });

        document.getElementById('boxName').value = '';
        document.getElementById('boxPhoto').value = '';
        saveAndRender();
    }

    function toggleReasonNote(id) {
        const reasonSelect = document.getElementById(`reason-give-${id}`).value;
        const noteField = document.getElementById(`note-give-${id}`);
        if (reasonSelect === 'Other') {
            noteField.style.display = 'block';
        } else {
            noteField.style.display = 'none';
        }
    }

    function updateKeysGiven(id) {
        const staff = document.getElementById(`staff-give-${id}`).value;
        const reasonSelect = document.getElementById(`reason-give-${id}`).value;
        const customNote = document.getElementById(`note-give-${id}`).value.trim();
        const isChecked = document.getElementById(`check-give-${id}`).checked;

        if (!isChecked) return alert('Please check the box confirming keys were given!');

        let fullReason = reasonSelect;
        if (reasonSelect === 'Other') {
            if (!customNote) return alert('Please type a note explaining the reason!');
            fullReason = `Other: ${customNote}`;
        }

        const now = new Date().toLocaleString();
        const box = lockBoxes.find(b => b.id === id);

        box.status = 'red';
        box.lastAction = `Keys removed by ${staff} [Reason: ${fullReason}]. LockBox is EMPTY.`;
        box.actionTime = now;

        saveAndRender();
    }

    function updateKeysAdded(id) {
        const staff = document.getElementById(`staff-add-${id}`).value;
        const isChecked = document.getElementById(`check-add-${id}`).checked;

        if (!isChecked) return alert('Please check the box confirming keys are inside!');

        const now = new Date().toLocaleString();
        const box = lockBoxes.find(b => b.id === id);

        box.status = 'green';
        box.lastAction = `Keys added to LockBox by ${staff}.`;
        box.actionTime = now;

        saveAndRender();
    }

    function deleteBox(id) {
        if (confirm("Delete this LockBox?")) {
            lockBoxes = lockBoxes.filter(b => b.id !== id);
            saveAndRender();
        }
    }

    function renderBoxes() {
        const list = document.getElementById('boxList');
        list.innerHTML = '';

        if (lockBoxes.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:12px;">No LockBoxes added yet.</p>';
            return;
        }

        lockBoxes.forEach(b => {
            let statusLabel = "Gray: Nothing Added";
            if (b.status === 'green') statusLabel = "Green: Keys Inside";
            if (b.status === 'red') statusLabel = "Red: Keys Missing";

            const item = document.createElement('div');
            item.className = 'lockbox-item';
            item.innerHTML = `
                <div class="lockbox-header">
                    <h4>📦 ${b.name}</h4>
                    <span class="status-badge bg-${b.status}">${statusLabel}</span>
                </div>
                
                ${b.photo ? `<img src="${b.photo}" class="lockbox-img">` : ''}

                <div class="log-info">
                    <strong>Last Status:</strong> ${b.lastAction}<br>
                    ${b.actionTime ? `<span>🕒 ${b.actionTime}</span>` : ''}
                </div>

                <!-- Keys Out Section -->
                <div class="action-block" style="border-left: 3px solid var(--red);">
                    <div class="section-title">🔑 Give Keys / Remove Keys</div>
                    
                    <select id="staff-give-${b.id}">
                        <option value="Alex">By: Alex</option>
                        <option value="Denis">By: Denis</option>
                    </select>

                    <select id="reason-give-${b.id}" onchange="toggleReasonNote(${b.id})">
                        <option value="Tenant Moved In">Reason: Tenant Moved In</option>
                        <option value="Tenant Lost Keys (Code Given)">Reason: Tenant Lost Keys (Access Code Given)</option>
                        <option value="Other">Reason: Other (Type Below)</option>
                    </select>

                    <input type="text" id="note-give-${b.id}" class="note-input" placeholder="Enter reason here...">

                    <div class="checkbox-group">
                        <input type="checkbox" id="check-give-${b.id}">
                        <label for="check-give-${b.id}">Keys out (LockBox empty)</label>
                    </div>

                    <button style="background-color: var(--red);" onclick="updateKeysGiven(${b.id})">Update: Keys Out (Empty)</button>
                </div>

                <!-- Refill Section -->
                <div class="action-block" style="border-left: 3px solid var(--green);">
                    <div class="section-title">📥 Restock / Add Keys</div>
                    
                    <select id="staff-add-${b.id}">
                        <option value="Alex">By: Alex</option>
                        <option value="Denis">By: Denis</option>
                    </select>

                    <div class="checkbox-group">
                        <input type="checkbox" id="check-add-${b.id}">
                        <label for="check-add-${b.id}">Keys placed inside LockBox</label>
                    </div>

                    <button style="background-color: var(--green);" onclick="updateKeysAdded(${b.id})">Update: Keys Inside</button>
                </div>

                <button style="background: transparent; color: #777; width: auto; font-size: 11px; margin-top: 6px; padding: 2px 4px;" onclick="deleteBox(${b.id})">🗑 Delete LockBox</button>
            `;
            list.appendChild(item);
        });
    }

    renderBoxes();
</script>

</body>
</html>
