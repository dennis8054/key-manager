<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LockBox Key Manager</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #222222;
            --border: #dddddd;
            --gray: #8e8e93;
            --green: #28a745;
            --red: #dc3545;
            --primary: #007bff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            background-color: var(--primary);
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            margin-top: 5px;
        }

        .bg-gray { background-color: var(--gray); }
        .bg-green { background-color: var(--green); }
        .bg-red { background-color: var(--red); }

        .lockbox-item {
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .lockbox-img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
            background-color: #eee;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }

        .checkbox-group input {
            width: auto;
            margin: 0;
        }

        .log-info {
            font-size: 12px;
            color: #666;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 LockBox Key Manager</h1>

    <!-- Add Lockbox Form -->
    <div class="card">
        <h3>+ Add New LockBox</h3>
        <input type="text" id="boxName" placeholder="LockBox Name / Location (e.g., Flat 4B)">
        <label style="font-size: 12px;">Add Location Photo:</label>
        <input type="file" id="boxPhoto" accept="image/*">
        <button onclick="addLockBox()">Add LockBox</button>
    </div>

    <!-- LockBox Inventory List -->
    <div class="card">
        <h3>LockBox Inventory</h3>
        <div id="boxList"></div>
    </div>
</div>

<script>
    let lockBoxes = JSON.parse(localStorage.getItem('myLockBoxes')) || [];

    function saveAndRender() {
        localStorage.setItem('myLockBoxes', JSON.stringify(lockBoxes));
        renderBoxes();
    }

    function addLockBox() {
        const name = document.getElementById('boxName').value.trim();
        const photoInput = document.getElementById('boxPhoto');

        if (!name) return alert('Please enter a LockBox name or location!');

        if (photoInput.files && photoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                createBoxObject(name, e.target.result);
            };
            reader.readAsDataURL(photoInput.files[0]);
        } else {
            createBoxObject(name, '');
        }
    }

    function createBoxObject(name, photoData) {
        lockBoxes.push({
            id: Date.now(),
            name: name,
            photo: photoData,
            status: 'gray', // gray = nothing added, green = keys inside, red = keys missing
            lastAction: 'No actions logged yet.',
            actionBy: '',
            actionTime: ''
        });

        document.getElementById('boxName').value = '';
        document.getElementById('boxPhoto').value = '';
        saveAndRender();
    }

    function updateKeysGiven(id) {
        const staff = document.getElementById(`staff-give-${id}`).value;
        const isChecked = document.getElementById(`check-give-${id}`).checked;

        if (!isChecked) return alert('Please tick the box confirming keys were given!');

        const now = new Date().toLocaleString();
        const box = lockBoxes.find(b => b.id === id);

        box.status = 'red'; // Red = empty, needs copy
        box.lastAction = `Keys handed to tenant by ${staff}. LockBox is now EMPTY (Needs key copy).`;
        box.actionBy = staff;
        box.actionTime = now;

        saveAndRender();
    }

    function updateKeysAdded(id) {
        const staff = document.getElementById(`staff-add-${id}`).value;
        const isChecked = document.getElementById(`check-add-${id}`).checked;

        if (!isChecked) return alert('Please tick the box confirming keys are inside!');

        const now = new Date().toLocaleString();
        const box = lockBoxes.find(b => b.id === id);

        box.status = 'green'; // Green = keys inside
        box.lastAction = `Keys added to LockBox by ${staff}.`;
        box.actionBy = staff;
        box.actionTime = now;

        saveAndRender();
    }

    function deleteBox(id) {
        if (confirm("Delete this LockBox?")) {
            lockBoxes = lockBoxes.filter(b => b.id !== id);
            saveAndRender();
        }
    }

    function renderBoxes() {
        const list = document.getElementById('boxList');
        list.innerHTML = '';

        if (lockBoxes.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#777;">No LockBoxes added yet.</p>';
            return;
        }

        lockBoxes.forEach(b => {
            let statusText = "Gray: Nothing Added Yet";
            if (b.status === 'green') statusText = "Green: Keys Inside";
            if (b.status === 'red') statusText = "Red: Keys Missing / Empty (Make Copy)";

            const item = document.createElement('div');
            item.className = 'lockbox-item';
            item.innerHTML = `
                <h4>📦 ${b.name}</h4>
                ${b.photo ? `<img src="${b.photo}" class="lockbox-img">` : ''}
                
                <div>
                    Status: <span class="status-badge bg-${b.status}">${statusText}</span>
                </div>

                <div class="log-info">
                    <strong>Last Update:</strong> ${b.lastAction}<br>
                    ${b.actionTime ? `<small>🕒 ${b.actionTime}</small>` : ''}
                </div>

                <!-- Move-In / Handout Section -->
                <div style="background: #fff3cd; padding: 10px; border-radius: 8px; margin-top: 10px;">
                    <div class="section-title">🔑 Move-In: Give Keys to Tenant</div>
                    <select id="staff-give-${b.id}">
                        <option value="Alex">Alex</option>
                        <option value="Denis">Denis</option>
                    </select>
                    <div class="checkbox-group">
                        <input type="checkbox" id="check-give-${b.id}">
                        <label for="check-give-${b.id}">Keys given to tenant (LockBox empty)</label>
                    </div>
                    <button style="background-color: var(--red);" onclick="updateKeysGiven(${b.id})">Update: Keys Out (Empty)</button>
                </div>

                <!-- Refill Section -->
                <div style="background: #d4edda; padding: 10px; border-radius: 8px; margin-top: 10px;">
                    <div class="section-title">📥 Refill: Put Keys in LockBox</div>
                    <select id="staff-add-${b.id}">
                        <option value="Alex">Alex</option>
                        <option value="Denis">Denis</option>
                    </select>
                    <div class="checkbox-group">
                        <input type="checkbox" id="check-add-${b.id}">
                        <label for="check-add-${b.id}">Keys are inside LockBox</label>
                    </div>
                    <button style="background-color: var(--green);" onclick="updateKeysAdded(${b.id})">Update: Keys Inside</button>
                </div>

                <button style="background: transparent; color: #999; width: auto; font-size: 12px; margin-top: 5px;" onclick="deleteBox(${b.id})">🗑 Delete LockBox</button>
            `;
            list.appendChild(item);
        });
    }

    renderBoxes();
</script>

</body>
</html>
